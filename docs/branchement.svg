<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="830" viewBox="0 0 1200 830"
     font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <style>
      .box   { fill: #f6f8fa; stroke: #444; stroke-width: 2; rx: 10; }
      .title { font-size: 17px; font-weight: 700; fill: #222; }
      .sub   { font-size: 13px; fill: #555; }
      .pin   { font-size: 13px; font-weight: 600; fill: #222; }
      .note  { font-size: 14px; fill: #333; }
      .red   { stroke: #d62828; stroke-width: 4; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .blk   { stroke: #222;    stroke-width: 4; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .sig   { stroke: #e9a800; stroke-width: 4; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .dotR  { fill: #d62828; }
      .dotK  { fill: #222; }
    </style>
  </defs>

  <rect width="1200" height="830" fill="#ffffff"/>

  <!-- Titre -->
  <text x="40" y="44" font-size="24" font-weight="700" fill="#111">Branchement FS-iA6B → ESP32-C3, alimentation par pile 18650</text>
  <text x="40" y="70" class="sub">Pile 18650 → chargeur TP4056 → interrupteur → survolteur 5 V → ESP32-C3 + récepteur FS-iA6B</text>

  <!-- Légende -->
  <g transform="translate(40,100)">
    <line x1="0" y1="0" x2="34" y2="0" class="red"/><text x="44" y="5" class="note">+ (batterie / 5 V)</text>
    <line x1="190" y1="0" x2="224" y2="0" class="blk"/><text x="234" y="5" class="note">GND (masse)</text>
    <line x1="350" y1="0" x2="384" y2="0" class="sig"/><text x="394" y="5" class="note">signal i-BUS</text>
  </g>

  <!-- ===================== Pile 18650 ===================== -->
  <rect x="40" y="320" width="170" height="130" class="box"/>
  <text x="60" y="345" class="title">Pile 18650</text>
  <text x="60" y="364" class="sub">Li-ion 3,0 – 4,2 V</text>
  <!-- dessin de la cellule -->
  <rect x="58" y="380" width="120" height="44" rx="8" fill="#3a86ff" stroke="#1d4e9e" stroke-width="2"/>
  <rect x="178" y="392" width="8" height="20" rx="2" fill="#9aa5b1" stroke="#555"/>
  <text x="76" y="408" font-size="15" font-weight="700" fill="#fff">18650</text>
  <text x="160" y="408" font-size="16" font-weight="700" fill="#fff">+</text>
  <text x="62" y="408" font-size="16" font-weight="700" fill="#fff">−</text>

  <!-- ===================== TP4056 ===================== -->
  <rect x="270" y="300" width="190" height="175" class="box"/>
  <text x="285" y="325" class="title">Chargeur TP4056</text>
  <text x="285" y="343" class="sub">avec protection (DW01)</text>
  <text x="285" y="359" class="sub">6 bornes : B± / OUT±</text>
  <text x="280" y="385" class="pin">B+</text>
  <text x="280" y="435" class="pin">B−</text>
  <text x="412" y="385" class="pin">OUT+</text>
  <text x="412" y="435" class="pin">OUT−</text>
  <!-- USB-C de charge -->
  <rect x="330" y="475" width="70" height="22" rx="6" fill="#bbb" stroke="#555" stroke-width="2"/>
  <text x="296" y="520" class="sub">USB-C 5 V : recharge</text>

  <!-- Pile -> TP4056 -->
  <path d="M210 380 H270" class="red"/>
  <path d="M210 430 H270" class="blk"/>
  <text x="214" y="372" class="pin" fill="#d62828">+</text>
  <text x="214" y="448" class="pin">−</text>

  <!-- ===================== Interrupteur ===================== -->
  <path d="M460 380 H498" class="red"/>
  <circle cx="503" cy="380" r="5" fill="#fff" stroke="#d62828" stroke-width="3"/>
  <line x1="507" y1="378" x2="548" y2="358" class="red"/>
  <circle cx="553" cy="380" r="5" fill="#fff" stroke="#d62828" stroke-width="3"/>
  <path d="M558 380 H590" class="red"/>
  <text x="478" y="345" class="sub">Interrupteur</text>
  <text x="490" y="330" class="sub">ON / OFF</text>

  <!-- TP4056 OUT- -> MT3608 VIN- -->
  <path d="M460 430 H590" class="blk"/>

  <!-- ===================== Survolteur ===================== -->
  <rect x="590" y="300" width="180" height="175" class="box"/>
  <text x="605" y="325" class="title">Survolteur MT3608</text>
  <text x="605" y="343" class="sub">sortie réglée à 5,0 V</text>
  <text x="605" y="359" class="sub">(à régler avant usage)</text>
  <text x="600" y="385" class="pin">VIN+</text>
  <text x="600" y="435" class="pin">VIN−</text>
  <text x="712" y="385" class="pin">VOUT+</text>
  <text x="712" y="435" class="pin">VOUT−</text>

  <!-- ===================== ESP32-C3 ===================== -->
  <rect x="880" y="90" width="270" height="180" class="box"/>
  <rect x="980" y="78" width="70" height="20" rx="6" fill="#bbb" stroke="#555" stroke-width="2"/>
  <text x="895" y="130" class="title">ESP32-C3 SuperMini</text>
  <text x="895" y="150" class="sub">USB-C : programmation / moniteur</text>
  <text x="895" y="168" class="sub">Bluetooth → tablette / PC</text>
  <text x="916" y="258" class="pin">5V</text>
  <text x="984" y="258" class="pin">GND</text>
  <text x="1056" y="242" class="pin">GPIO20</text>
  <text x="1064" y="258" class="pin">(RX)</text>

  <!-- ===================== FS-iA6B ===================== -->
  <rect x="880" y="520" width="270" height="190" class="box"/>
  <text x="895" y="600" class="title">Récepteur FS-iA6B</text>
  <text x="895" y="620" class="sub">port « i-BUS SERVO »</text>
  <text x="895" y="638" class="sub">câble servo 3 fils</text>
  <text x="895" y="656" class="sub">alimentation 4,0 – 6,5 V</text>
  <text x="922" y="545" class="pin">+</text>
  <text x="994" y="545" class="pin">−</text>
  <text x="1074" y="545" class="pin">S</text>
  <!-- antennes -->
  <line x1="1130" y1="710" x2="1160" y2="780" stroke="#666" stroke-width="2"/>
  <line x1="1110" y1="710" x2="1090" y2="785" stroke="#666" stroke-width="2"/>

  <!-- ===================== Câblage 5 V / GND / signal ===================== -->
  <!-- +5 V : VOUT+ -> bus vertical x=930 (ESP 5V en haut, récepteur + en bas) -->
  <path d="M770 380 H930" class="red"/>
  <path d="M930 270 V520" class="red"/>
  <circle cx="930" cy="380" r="6" class="dotR"/>

  <!-- GND : VOUT- -> bus vertical x=1000, avec saut au croisement du +5 V -->
  <path d="M770 430 H922 A8 8 0 0 1 938 430 H1000" class="blk"/>
  <path d="M1000 270 V520" class="blk"/>
  <circle cx="1000" cy="430" r="6" class="dotK"/>

  <!-- Signal i-BUS : récepteur S -> GPIO20 -->
  <path d="M1080 520 V270" class="sig"/>
  <text x="1090" y="400" class="note" fill="#9a6f00">i-BUS</text>

  <!-- Repères de broches -->
  <circle cx="930"  cy="270" r="5" class="dotR"/>
  <circle cx="1000" cy="270" r="5" class="dotK"/>
  <circle cx="1080" cy="270" r="5" fill="#e9a800"/>
  <circle cx="930"  cy="520" r="5" class="dotR"/>
  <circle cx="1000" cy="520" r="5" class="dotK"/>
  <circle cx="1080" cy="520" r="5" fill="#e9a800"/>

  <!-- ===================== Notes ===================== -->
  <rect x="40" y="560" width="800" height="250" rx="10" fill="#fffbea" stroke="#e0c46c" stroke-width="2"/>
  <text x="60" y="590" font-size="17" font-weight="700" fill="#222">À savoir</text>
  <text x="60" y="618" class="note">1. Régler le MT3608 à 5,0 V au multimètre AVANT d'y brancher l'ESP32 et le récepteur.</text>
  <text x="60" y="644" class="note">2. Le FS-iA6B demande au moins 4,0 V : la 18650 seule (3,0 – 4,2 V) ne suffit pas, d'où le survolteur.</text>
  <text x="60" y="670" class="note">3. Utiliser un TP4056 AVEC protection (bornes OUT+/OUT−) : il coupe en cas de décharge profonde.</text>
  <text x="60" y="696" class="note">4. Mettre l'interrupteur sur OFF avant de brancher l'ESP32 au PC en USB (évite deux sources 5 V reliées).</text>
  <text x="60" y="722" class="note">5. Masse (GND) commune à tout le montage.</text>
  <text x="60" y="748" class="note">6. Sur l'émetteur : System → RX setup → Output mode → Serial : i-BUS.</text>
  <text x="60" y="774" class="note">7. Recharge par l'USB-C du TP4056, de préférence interrupteur sur OFF.</text>
  <text x="60" y="798" class="sub">Broches modifiables dans platformio.ini (IBUS_RX_PIN). GPIO21 (TX) n'est pas utilisé.</text>
</svg>
