; Pont iBUS -> manette Bluetooth (BLE HID) pour VelociDrone
; FS-i6X -> récepteur FlySky (sortie i-BUS) -> ESP32 -> PC en Bluetooth

[platformio]
default_envs = esp32c3

[common]
lib_deps =
  lemmingdev/ESP32-BLE-Gamepad
  h2zero/NimBLE-Arduino

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps = ${common.lib_deps}
build_flags =
  -D IBUS_RX_PIN=16
  -D IBUS_TX_PIN=17
  -D DEBUG_CHANNELS=0   ; 1 = affiche les voies dans le moniteur série
  -D SENS_RX_PIN=26     ; télémétrie (port SENS du récepteur), -1 = désactivée
  -D SENS_TX_PIN=27     ; via une diode, bague côté ESP32
  -D BATT_ADC_PIN=34    ; pont diviseur de la pile (ADC1), -1 = désactivée
  -D BATT_DIVIDER=2.0

; Pour un ESP32-C3 (choisis des broches libres sur ta carte)
[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
board_build.flash_mode = dio   ; la plupart des cartes C3 (SuperMini, etc.) ne supportent pas QIO
framework = arduino
monitor_speed = 115200
lib_deps = ${common.lib_deps}
build_flags =
  -D IBUS_RX_PIN=20
  -D IBUS_TX_PIN=21
  -D DEBUG_CHANNELS=0
  -D SENS_RX_PIN=6
  -D SENS_TX_PIN=7
  -D BATT_ADC_PIN=3     ; ADC1 ; éviter GPIO2 et GPIO9 (broches de démarrage), GPIO8 (LED)
  -D BATT_DIVIDER=2.0
  -D CONFIG_NIMBLE_CPP_ENABLE_RETURN_CODE_TEXT   ; codes d'erreur BLE en clair dans le journal
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1

; Pour un ESP32-S3
[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps = ${common.lib_deps}
build_flags =
  -D IBUS_RX_PIN=16
  -D IBUS_TX_PIN=17
  -D DEBUG_CHANNELS=0
  -D SENS_RX_PIN=4
  -D SENS_TX_PIN=5
  -D BATT_ADC_PIN=1
  -D BATT_DIVIDER=2.0
